<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Artur Pereć</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f9fa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>document.documentElement.classList.add('js'); try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t } catch {}</script>
  <link rel="preload" href="/assets/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Served for any missing address, so every path here starts from the site root -->
  <link rel="stylesheet" href="/style.css?v=18">
</head>
<body>
  <main class="not-found">
    <p class="not-found-code">404</p>
    <h1>This page doesn’t exist</h1>
    <p>The address may be mistyped, or the page has moved. Everything is on the main page.</p>
    <a class="button" href="/">Go to the main page</a>
    <p class="not-found-pl" lang="pl">Tej strony nie ma. <a href="/pl/">Przejdź do strony głównej po polsku</a></p>
  </main>
</body>
</html>
